# GameGlass Hub - Flathub manifest
#
# This does NOT build the app from source. It repackages the official prebuilt
# Linux release (the .deb produced by `pnpm release:linux`) that GameGlass
# publishes to https://download.gameglass.gg/hub/.
#
# When a new version ships, run ./update-manifest.sh to refresh the sha256 and
# add a <release> entry to gg.gameglass.hub.metainfo.xml.
id: gg.gameglass.hub
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: gameglass-hub
separate-locales: false

finish-args:
  # Wayland first, X11 as fallback. Flathub rejects x11 + wayland together.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=all
  - --share=network
  - --socket=pulseaudio
  # Screenshots are written to ~/Pictures/GameGlass, plugin/overlay downloads to ~/Downloads.
  - --filesystem=xdg-pictures/GameGlass:create
  - --filesystem=xdg-download
  # Tray icon + desktop notifications.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/udev
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ---------------------------------------------------------------------------
  # libinput stack. The freedesktop runtime does not ship libinput, but
  # @gameglass/native-keymap links against libinput.so.10. Each module below is
  # a build dependency of the next, so the order matters.
  # ---------------------------------------------------------------------------
  - name: mtdev
    buildsystem: autotools
    sources:
      - type: archive
        url: https://bitmath.org/code/mtdev/mtdev-1.1.7.tar.bz2
        sha256: a107adad2101fecac54ac7f9f0e0a0dd155d954193da55c2340c97f2ff1d814e

  - name: libevdev
    buildsystem: autotools
    sources:
      - type: archive
        url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.4.tar.xz
        sha256: f00ab8d42ad8b905296fab67e13b871f1a424839331516642100f82ad88127cd

  - name: libinput
    buildsystem: meson
    config-opts:
      - -Dlibwacom=false
      - -Ddebug-gui=false
      - -Dtests=false
      - -Ddocumentation=false
      - -Dudev-dir=/app/lib/udev
    sources:
      - type: archive
        url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.27.1/libinput-1.27.1.tar.gz
        sha256: f6d623dd8230db337a6457645ebca96b9d4788a56385463bb14b8174910dfe23

  # ---------------------------------------------------------------------------
  # The application itself, unpacked from the official .deb.
  # ---------------------------------------------------------------------------
  - name: gameglass-hub
    buildsystem: simple
    build-commands:
      - ar x GameGlass.deb
      - tar -xf data.tar.xz

      - mkdir -p /app/gameglass-hub
      - cp -a "opt/GameGlass Hub/." /app/gameglass-hub/
      # zypak provides the sandbox inside Flatpak; the setuid helper cannot work here.
      - rm -f /app/gameglass-hub/chrome-sandbox
      - mv "/app/gameglass-hub/@gameglasshub" /app/gameglass-hub/gameglass-hub

      - install -Dm755 gameglass-hub.sh /app/bin/gameglass-hub
      - install -Dm644 gg.gameglass.hub.desktop /app/share/applications/gg.gameglass.hub.desktop
      - install -Dm644 gg.gameglass.hub.metainfo.xml /app/share/metainfo/gg.gameglass.hub.metainfo.xml

      - |
        for size in 16 32 48 64 128 256 512; do
          install -Dm644 "usr/share/icons/hicolor/${size}x${size}/apps/@gameglasshub.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/gg.gameglass.hub.png"
        done

      - install -Dm644 /app/gameglass-hub/LICENSE.electron.txt /app/share/licenses/gg.gameglass.hub/LICENSE.electron.txt
      - install -Dm644 /app/gameglass-hub/LICENSES.chromium.html /app/share/licenses/gg.gameglass.hub/LICENSES.chromium.html
      - install -Dm644 LICENSE.txt /app/share/licenses/gg.gameglass.hub/LICENSE.txt

      # A Flatpak cannot install a udev rule on the host, so ship it where the
      # user can copy it out. See README.md and the metainfo description.
      - install -Dm644 60-gameglass-input.rules /app/share/gg.gameglass.hub/udev/60-gameglass-input.rules
    sources:
      # TODO: point this at a version-pinned URL (e.g. .../hub/8.2.1/GameGlass.deb).
      # This rolling URL changes content on every release, which breaks any rebuild
      # of this manifest as soon as a new version is published.
      - type: file
        url: https://download.gameglass.gg/hub/GameGlass.deb
        sha256: be7d2d885b0e89c48bdb8a94e49fcdc50203a75ed835ba3d420ecbca6ab9768b
        dest-filename: GameGlass.deb
      - type: file
        path: gameglass-hub.sh
      - type: file
        path: gg.gameglass.hub.desktop
      - type: file
        path: gg.gameglass.hub.metainfo.xml
      - type: file
        path: LICENSE.txt
      - type: file
        path: 60-gameglass-input.rules
